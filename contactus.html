<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - The Liquid Hotplates</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Aurora background accent - 2 blue blobs (same as Events/Members) + a 3rd orange one -->
  <div class="page-aurora-bg small">
    <div class="aurora-blob-orange"></div>
  </div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <img src="images/logo.png" alt="LHP Logo" class="logo-img">
        <span class="site-name">The Liquid Hotplates</span>
      </div>
      <div class="nav-pill">
        <ul class="nav-links">
          <li class="nav-item"><a href="index.html">Home</a></li>

    </div>

  <section class="section" style="padding-top: 9rem; text-align: center;">
    <div class="container" style="max-width: 700px; margin: 0 auto;">
      <h2 class="reveal-text">Contact Us!</h2>

        <br><br>

      </p>

        <a href="https://instagram.com/theliquidhotplates" target="_blank" class="btn">
          📸 Instagram
        </a>
        <a href="mailto:theliquidhotplates@gmail.com" class="btn btn-outline">
